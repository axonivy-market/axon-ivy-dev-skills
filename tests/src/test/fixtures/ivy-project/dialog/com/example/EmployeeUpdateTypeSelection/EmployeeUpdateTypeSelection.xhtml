<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{ivy.cms.co('/Dialogs/com/example/EmployeeUpdateTypeSelection/Title')}</ui:define>
    <ui:define name="content">

      <h:form id="form" styleClass="grid">
        <div class="col-12">
          <p:messages id="form-messages" showDetail="true" />
        </div>

        <div class="col-12 p-fluid">
          <p:outputLabel for="update-type" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeUpdateTypeSelection/Prompt')}" styleClass="font-semibold" />
          <p:selectOneRadio id="update-type" value="#{data.updateType}" layout="responsive" columns="1" required="true" requiredMessage="#{ivy.cms.co('/Dialogs/com/example/EmployeeUpdateTypeSelection/SelectionRequired')}">
            <f:selectItem id="personal-info" itemLabel="#{ivy.cms.co('/Dialogs/com/example/EmployeeUpdateTypeSelection/EmployeePersonalInfo')}" itemValue="EMPLOYEE_PERSONAL_INFO" />
            <f:selectItem id="job-info" itemLabel="#{ivy.cms.co('/Dialogs/com/example/EmployeeUpdateTypeSelection/EmployeeJobInfo')}" itemValue="EMPLOYEE_JOB_INFO" />
          </p:selectOneRadio>
        </div>

        <div class="col-12 mt-3 text-right">
          <p:commandLink id="cancel" actionListener="#{logic.close}" process="@this" immediate="true" value="#{ivy.cms.co('/Labels/Cancel')}" styleClass="ui-button-secondary mr-2" />
          <p:commandButton id="submit" actionListener="#{logic.submit}" process="@form" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeUpdateTypeSelection/Continue')}" update="@form" icon="ti ti-arrow-right" styleClass="ui-button-primary" />
        </div>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>

</html>
