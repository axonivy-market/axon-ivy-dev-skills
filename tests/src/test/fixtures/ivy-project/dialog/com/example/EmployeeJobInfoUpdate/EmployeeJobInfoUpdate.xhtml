<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/Title')}</ui:define>
    <ui:define name="content">

      <h:form id="form" styleClass="grid">
        <div class="col-12">
          <p:messages id="form-messages" showDetail="true" />
          <h:outputText value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/Instruction')}" styleClass="text-color-secondary" />
        </div>

        <div class="col-12 md:col-6 p-fluid">
          <div class="field">
            <p:outputLabel for="job-title" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/JobTitle')}" styleClass="font-semibold" />
            <p:selectOneMenu id="job-title" value="#{data.selectedJobTitleCode}" required="true" requiredMessage="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/JobTitleRequired')}" styleClass="w-full">
              <f:selectItems id="job-title-options" value="#{data.jobTitles}" var="title" itemLabel="#{title.titleName}" itemValue="#{title.titleCode}" />
              <p:ajax event="change" listener="#{logic.updateJobTitleDetails}" process="@this" update="job-title-details form-messages" />
            </p:selectOneMenu>
          </div>
          <h:panelGroup id="job-title-details" layout="block" styleClass="grid p-fluid">
            <div class="field col-12">
              <p:outputLabel for="job-title-name" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/JobTitleName')}" />
              <p:inputText id="job-title-name" value="#{data.jobTitleName}" readonly="true" styleClass="w-full" />
            </div>
            <div class="field col-12">
              <p:outputLabel for="job-title-description" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/JobTitleDescription')}" />
              <p:inputTextarea id="job-title-description" value="#{data.jobTitleDescription}" readonly="true" rows="3" styleClass="w-full" />
            </div>
          </h:panelGroup>
        </div>

        <div class="col-12 md:col-6 p-fluid">
          <div class="field">
            <p:outputLabel for="department" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/Department')}" styleClass="font-semibold" />
            <p:selectOneMenu id="department" value="#{data.selectedDepartmentCode}" required="true" requiredMessage="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/DepartmentRequired')}" styleClass="w-full">
              <f:selectItems id="department-options" value="#{data.departments}" var="department" itemLabel="#{department.departmentName}" itemValue="#{department.departmentCode}" />
              <p:ajax event="change" listener="#{logic.updateDepartmentDetails}" process="@this" update="department-details form-messages" />
            </p:selectOneMenu>
          </div>
          <h:panelGroup id="department-details" layout="block" styleClass="grid p-fluid">
            <div class="field col-12">
              <p:outputLabel for="department-name" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/DepartmentName')}" />
              <p:inputText id="department-name" value="#{data.departmentName}" readonly="true" styleClass="w-full" />
            </div>
            <div class="field col-12">
              <p:outputLabel for="department-description" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/DepartmentDescription')}" />
              <p:inputTextarea id="department-description" value="#{data.departmentDescription}" readonly="true" rows="3" styleClass="w-full" />
            </div>
          </h:panelGroup>
        </div>

        <div class="col-12 mt-3 text-right">
          <p:commandLink id="cancel" actionListener="#{logic.close}" process="@this" immediate="true" value="#{ivy.cms.co('/Labels/Cancel')}" styleClass="ui-button-secondary mr-2" />
          <p:commandButton id="submit" actionListener="#{logic.submit}" process="@form" value="#{ivy.cms.co('/Dialogs/com/example/EmployeeJobInfoUpdate/SaveJobInformation')}" update="@form" icon="ti ti-check" styleClass="ui-button-primary" />
        </div>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>

</html>
