name: CI-Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read
  checks: write
  copilot-requests: write

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install skill loader dependencies
        run: pip install openpyxl

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Build skill-evals module
        run: mvn install --batch-mode --projects skill-evals --also-make -DskipTests

      - name: Run tests in tests module
        run: mvn test --batch-mode --projects tests

      - name: Publish test summary
        if: success() || failure()
        uses: ScalableCapital/action-surefire-report@v2
        with:
          report_paths: tests/target/surefire-reports/TEST-*.xml

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ github.run_id }}
          path: tests/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
