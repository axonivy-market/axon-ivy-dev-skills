<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">Dialog Title</ui:define>
    <ui:define name="content">

      <h:form id="form" styleClass="grid">
        <div class="col-12">
          <p:messages id="form-messages" showDetail="true" />
        </div>

        <!-- FORM CONTENT GOES HERE -->

        <div class="col-12 mt-3 text-right">
          <p:commandLink id="cancel"
                         actionListener="#{logic.close}"
                         process="@this"
                         value="Cancel"
                         styleClass="ui-button-secondary mr-2" />

          <p:commandButton id="proceed"
                           actionListener="#{logic.submit}"
                           value="Submit"
                           update="form"
                           icon="ti ti-check"
                           styleClass="ui-button-primary" />
        </div>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>
</html>
